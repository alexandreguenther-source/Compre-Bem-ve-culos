<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel · CompreBem Veículos</title>
<link rel="icon" href="img/logo.svg">
<script src="js/tema.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body data-pagina="painel">

<main id="conteudo">
  <div class="titulo-pagina">
    <div>
      <h1>Painel</h1>
      <p id="saudacao">Resumo da garagem hoje.</p>
    </div>
    <div class="d-flex gap-2">
      <a href="cliente-form.html" class="btn btn-outline-primary"><i class="bi bi-person-plus me-1"></i>Novo cliente</a>
      <a href="veiculo-form.html" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Novo veículo</a>
    </div>
  </div>

  <!-- RF16: aviso de oportunidades (clientes procurando carros que já estão no estoque) -->
  <div id="alerta-oportunidades" class="alert alert-warning d-flex flex-wrap align-items-center gap-3 shadow-sm" role="alert" hidden>
    <i class="bi bi-bell-fill fs-3"></i>
    <div class="flex-grow-1"><strong id="alerta-titulo"></strong><div class="small" id="alerta-texto"></div></div>
    <a href="oportunidades.html" class="btn btn-dark">Ver e avisar</a>
  </div>

  <!-- RF10: indicadores do estoque e dos clientes -->
  <div class="row g-3 mb-4">
    <div class="col-sm-6 col-xl-3"><div class="cartao indicador">
      <div class="icone azul"><i class="bi bi-people-fill"></i></div>
      <div><div class="valor" id="ind-clientes">0</div><div class="rotulo">Clientes cadastrados</div></div>
    </div></div>
    <div class="col-sm-6 col-xl-3"><div class="cartao indicador">
      <div class="icone verde"><i class="bi bi-car-front-fill"></i></div>
      <div><div class="valor" id="ind-disponiveis">0</div><div class="rotulo">Veículos disponíveis</div></div>
    </div></div>
    <div class="col-sm-6 col-xl-3"><div class="cartao indicador">
      <div class="icone laranja"><i class="bi bi-bookmark-star-fill"></i></div>
      <div><div class="valor" id="ind-reservados">0</div><div class="rotulo">Reservados</div></div>
    </div></div>
    <div class="col-sm-6 col-xl-3"><div class="cartao indicador">
      <div class="icone cinza"><i class="bi bi-cash-stack"></i></div>
      <div><div class="valor" id="ind-valor">R$ 0</div><div class="rotulo">Valor do estoque disponível</div></div>
    </div></div>
  </div>

  <div class="row g-3">
    <div class="col-xl-8">
      <section class="card cartao h-100">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span><i class="bi bi-clock-history me-2"></i>Últimos veículos cadastrados</span>
          <a href="veiculos.html" class="small">Ver todos</a>
        </div>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead><tr><th>Placa</th><th>Veículo</th><th>Preço</th><th>Status</th></tr></thead>
            <tbody id="ultimos"></tbody>
          </table>
        </div>
      </section>
    </div>
    <div class="col-xl-4">
      <section class="card cartao h-100">
        <div class="card-header"><i class="bi bi-pie-chart me-2"></i>Estoque por status</div>
        <div class="card-body" id="por-status"></div>
      </section>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/dados.js"></script>
<script src="js/util.js"></script>
<script src="js/layout.js"></script>
<script src="js/paginas/painel.js"></script>
</body>
</html>
