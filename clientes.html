<!DOCTYPE html>

<head>

<main id="conteudo">

            <tr><th>Nome</th><th class="d-none d-md-table-cell">CPF</th><th>Telefone</th><th class="d-none d-lg-table-cell">Cidade</th><th>Veículos</th><th class="sem-ordem text-end">Ações</th></tr>
