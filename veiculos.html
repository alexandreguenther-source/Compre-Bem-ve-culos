<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veículos · CompreBem Veículos</title>
<link rel="icon" href="img/logo.svg">
<script src="js/tema.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body data-pagina="veiculos">

<main id="conteudo">
  <div class="titulo-pagina">
    <div>
      <h1>Veículos</h1>
      <p>Estoque da garagem: disponíveis, reservados e vendidos.</p>
    </div>
    <a href="veiculo-form.html" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Novo veículo</a>
  </div>

  <div class="btn-group mb-3 flex-wrap" role="group" aria-label="Filtrar por status" id="filtros">
    <input type="radio" class="btn-check" name="filtro" id="f-todos" value="" checked>
    <label class="btn btn-outline-primary" for="f-todos">Todos <span class="badge text-bg-light ms-1" data-qtd=""></span></label>
    <input type="radio" class="btn-check" name="filtro" id="f-disp" value="Disponível">
    <label class="btn btn-outline-primary" for="f-disp">Disponíveis <span class="badge text-bg-light ms-1" data-qtd="Disponível"></span></label>
    <input type="radio" class="btn-check" name="filtro" id="f-res" value="Reservado">
    <label class="btn btn-outline-primary" for="f-res">Reservados <span class="badge text-bg-light ms-1" data-qtd="Reservado"></span></label>
    <input type="radio" class="btn-check" name="filtro" id="f-vend" value="Vendido">
    <label class="btn btn-outline-primary" for="f-vend">Vendidos <span class="badge text-bg-light ms-1" data-qtd="Vendido"></span></label>
  </div>

  <section class="card cartao">
    <div class="card-body">
      <div class="table-responsive">
        <!-- RF06: lista com DataTables (busca, ordenação e paginação) -->
        <table id="tabela-veiculos" class="table table-hover align-middle w-100">
          <thead>
            <tr><th>Placa</th><th>Veículo</th><th class="d-none d-md-table-cell">Ano</th><th class="d-none d-md-table-cell">KM</th><th>Preço</th><th>Status</th><th class="d-none d-lg-table-cell">Cliente</th><th class="sem-ordem text-end">Ações</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
<script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script>
<script src="js/config.js"></script>
<script src="js/dados.js"></script>
<script src="js/util.js"></script>
<script src="js/layout.js"></script>
<script src="js/paginas/veiculos.js"></script>
</body>
</html>
